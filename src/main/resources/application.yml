# 이 파일에는 "설정 서버를 어떻게 찾을지"만 둔다.
# 포트, backend 주소, 잡 주기는 모두 ocr-config-server 가 내려준다.
spring:
  application:
    # 설정 서버가 ocr-scheduler.yml 을 찾는 기준이 되는 이름. 바꾸면 설정을 못 받는다.
    name: ocr-scheduler
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      # 설정 서버 자격증명. 부트스트랩 값이라 설정 서버로 내려받을 수 없다(닭과 달걀).
      username: ${CONFIG_USER:ocr}
      password: ${CONFIG_PASSWORD:local-dev-only-password}
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000
